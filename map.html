<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// HOW TO EDIT: each shaded country (3-letter code) lists its papers as [topic, title].
// Topics: Land, Forests, Water, Climate, Health, Pollution. Titles should match research.html.
var REGIONS = {
  BRA: { name: 'Brazil', papers: [
    ['Land', 'Land Registration and Conflict Reduction: Evidence from the Brazilian Amazon'],
    ['Forests', 'Beyond the Canopy: How Satellite Data Detection Thresholds Influence Policy Evaluation and Deforestation Behavior'],
    ['Land', 'Collective Property Rights Lead to Secondary Forest Growth in the Brazilian Amazon'],
    ['Land', 'Clearing to Claim: The Perverse Incentives of Land Regularization in the Brazilian Amazon'],
    ['Forests', 'Improving Environmental Outcomes Through Investments in Local Governance: Evidence from Brazil'],
    ['Forests', 'Drought-Induced Deforestation in the Brazilian Amazon']
  ]},
  USA: { name: 'United States', papers: [
    ['Health', 'Primary Care, Weather, and the Missed Opportunity for Savings'],
    ['Water', 'Gross External Damages of Water Pollution in the United States'],
    ['Forests', 'Forest Disease, Wildfire Risk, and Recreational Welfare: Evidence from the USA'],
    ['Pollution', 'Hazardous Waste Sites Alter Regional Soil Chemistry: Evidence from 80,000 Soil Tests in Tennessee']
  ]},
  IND: { name: 'India', papers: [
    ['Forests', 'Incentives for Rural Households to Establish Tree Cover on Agricultural Land in Andhra Pradesh, India'],
    ['Water', 'Unintended Consequences of a Large Irrigation Project for Groundwater Recharge'],
    ['Climate', 'Thirteenth Month of a Drought Year: Agricultural Shocks and Judicial Outcomes in India'],
    ['Water', 'The Agrarian Cost of Groundwater Depletion in India']
  ]},
  CHN: { name: 'China', papers: [
    ['Climate', 'The Cold, Hard Truth: Evidence from Heterogeneous Snowpack Insulation Effect on Winter Wheat Yields in China']
  ]},
  AFR: { name: 'Sub-Saharan Africa', papers: [  // shades every Sub-Saharan country
    ['Forests', 'The Human Well-Being Outcomes of Tree Plantations in Sub-Saharan Africa: A Reassessment of Evidence Using Longitudinal Subnational-Year Data']
  ]}
};
// Uganda also has its own paper, listed above the Sub-Saharan one.
REGIONS.UGA = { name: 'Uganda', papers: [
  ['Forests', 'Disease at the Root, Deforestation at the Edge: Cassava Epidemic and Deforestation in Uganda']
].concat(REGIONS.AFR.papers) };

var AFRICA_SUBREGIONS = ['Eastern Africa', 'Middle Africa', 'Southern Africa', 'Western Africa'];
var COLORS = { region: '#990000', land: '#E4E4E4', sea: '#F7F7F5' };

function regionOf(p) {
  if (REGIONS[p.iso]) return REGIONS[p.iso];
  if (AFRICA_SUBREGIONS.indexOf(p.sub) !== -1 && p.iso !== 'SDN') return REGIONS.AFR;
  return null;
}

function popupHtml(name, r) {
  var items = r.papers.map(function (pp) {
    return '<li><span class="topic">' + pp[0] + '</span>' + pp[1] + '</li>';
  }).join('');
  return '<p class="pop-h">' + r.name +
    (r === REGIONS.AFR ? ' <span>(' + name + ')</span>' : '') + '</p>' +
    '<ul class="pop-l">' + items + '</ul>' +
    '<a href="research.html">Full citations</a>';
}

var map = L.map('map', {
  zoomSnap: 0.25, scrollWheelZoom: false, worldCopyJump: false,
  maxBounds: [[-70, -200], [85, 200]], minZoom: 1, attributionControl: false
});
map.getContainer().style.background = COLORS.sea;
map.fitBounds([[-40, -168], [72, 150]]);

fetch('data/countries.geojson').then(function (r) { return r.json(); }).then(function (data) {
  L.geoJSON(data, {
    style: function (f) {
      var r = regionOf(f.properties);
      return {
        fillColor: r ? COLORS.region : COLORS.land, fillOpacity: 1,
        color: '#FFFFFF', weight: 0.8
      };
    },
    onEachFeature: function (f, layer) {
      var r = regionOf(f.properties);
      if (!r) { layer.options.interactive = false; return; }
      layer.bindPopup(popupHtml(f.properties.name, r), { maxWidth: 320 });
      layer.on('mouseover', function () { layer.setStyle({ weight: 2, color: '#1B1F23' }); layer.bringToFront(); });
      layer.on('mouseout', function () { layer.setStyle({ weight: 0.8, color: '#FFFFFF' }); });
    }
  }).addTo(map);
});
</script>
